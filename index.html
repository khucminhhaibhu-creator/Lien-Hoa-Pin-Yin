<style>
:root{--red:#a70f19;--dark:#700a10;--gold:#d7ad43;--bg:#f6f0e6;--ink:#202020;--muted:#777;--line:#e8dccb;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff,#f5ead8);font-family:Arial,"Noto Sans",sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:1000px;margin:auto;min-height:100vh;padding:14px}.hero{background:linear-gradient(135deg,var(--dark),var(--red));color:#fff;border-radius:22px;padding:20px;text-align:center;box-shadow:0 10px 30px #0002}.brand{font-size:28px;font-weight:900;letter-spacing:1px}.tag{margin-top:5px;color:#ffe7a2;font-size:13px;font-weight:800}.tabs{display:flex;gap:8px;margin-top:14px}.tab{flex:1;border:0;border-radius:12px;padding:11px;background:#ffffff1c;color:#fff;font-weight:800;cursor:pointer}.tab.active{background:#fff;color:var(--dark)}.card{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 5px 22px #00000012}.label{font-weight:800;color:var(--dark);margin-bottom:8px}.inputRow{display:flex;gap:8px}.input{width:100%;min-height:76px;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:25px;outline:none;resize:vertical}.input:focus{border-color:var(--red)}.candidateBar{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;min-height:58px}.candidate{white-space:nowrap;border:1px solid #ead8b9;background:#fff8eb;border-radius:11px;padding:9px 13px;cursor:pointer;font-size:21px}.candidate b{font-size:12px;color:#a67b20;margin-right:5px}.candidate.primary{background:var(--red);color:#fff;border-color:var(--red)}.candidate.primary b{color:#ffe9a2}.keyboard{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}.key{border:0;border-radius:10px;background:#f3ece2;padding:12px 4px;font-weight:800;cursor:pointer}.key:hover{background:#e8dbc8}.key.red{color:var(--red)}.key.wide{grid-column:span 2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.action{border:0;border-radius:11px;padding:11px 15px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.action.secondary{background:#eee;color:#333}.preview{background:#fbf7ef;border-radius:14px;padding:16px;font-size:32px;min-height:75px;word-break:break-word}.learn{display:none}.learn.show{display:block}.tool{display:block}.tool.hide{display:none}.wordCard{border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;background:#fff}.han{font-size:29px;font-weight:900}.py{color:var(--red);font-size:17px;font-weight:700}.meaning{margin-top:4px}.meta{font-size:12px;color:var(--muted);margin-top:6px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px}.footer{text-align:center;padding:20px;color:#777;font-size:12px}.empty{color:#888;padding:10px 2px}.tip{font-size:13px;color:#777;line-height:1.5;margin-top:8px}
@media(max-width:650px){.keyboard{grid-template-columns:repeat(7,1fr)}.keyboard .wide{grid-column:span 2}.input{font-size:21px}.preview{font-size:27px}.candidate{font-size:19px}.brand{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="brand">LIÊN HOA PINYIN</div><div class="tag">HỌC ĐỂ THAY ĐỔI • BỘ GÕ & HỌC TIẾNG TRUNG</div><div class="tabs"><button class="tab active" id="tabType">⌨️ Bộ gõ</button><button class="tab" id="tabLearn">📚 Học từ</button></div></header>
<main class="tool" id="tool">
<section class="card"><div class="label">Nhập Pinyin</div><div class="inputRow"><textarea class="input" id="input" placeholder="Ví dụ: nihao, woaini, xuexiao, zhongguo"></textarea></div>
<div class="candidateBar" id="candidates"></div>
<div class="keyboard" id="keyboard">
<button class="key" data-k="q">q</button><button class="key" data-k="w">w</button><button class="key" data-k="e">e</button><button class="key" data-k="r">r</button><button class="key" data-k="t">t</button><button class="key" data-k="y">y</button><button class="key" data-k="u">u</button><button class="key" data-k="i">i</button><button class="key" data-k="o">o</button><button class="key" data-k="p">p</button>
<button class="key" data-k="a">a</button><button class="key" data-k="s">s</button><button class="key" data-k="d">d</button><button class="key" data-k="f">f</button><button class="key" data-k="g">g</button><button class="key" data-k="h">h</button><button class="key" data-k="j">j</button><button class="key" data-k="k">k</button><button class="key" data-k="l">l</button><button class="key" data-k="'">'</button>
<button class="key" data-k="z">z</button><button class="key" data-k="x">x</button><button class="key" data-k="c">c</button><button class="key" data-k="v">ü</button><button class="key" data-k="b">b</button><button class="key" data-k="n">n</button><button class="key" data-k="m">m</button><button class="key" data-k="，">，</button><button class="key" data-k="。">。</button><button class="key red" data-k="⌫">⌫</button>
<button class="key red" data-k="1">ā á ǎ à</button><button class="key red" data-k="2">ē é ě è</button><button class="key red" data-k="3">ī í ǐ ì</button><button class="key red" data-k="4">ō ó ǒ ò</button><button class="key red" data-k="5">ū ú ǔ ù</button><button class="key red" data-k="6">ǖ ǘ ǚ ǜ</button><button class="key wide" data-k=" ">SPACE</button><button class="key wide" data-k="ENTER">↵</button>
</div>
<div class="actions"><button class="action" id="useTone">Chuyển số → dấu</button><button class="action secondary" id="copy">Sao chép chữ Hán</button><button class="action secondary" id="clear">Xóa</button></div>
<div class="tip">Gõ không dấu để tìm ứng viên: <b>nihao</b> → <b>你好</b>. Gõ <b>ni3 hao3</b> để xem Pinyin có dấu. Nhấn một ứng viên để chèn chữ Hán.</div></section>
<section class="card"><div class="label">Kết quả</div><div class="preview" id="preview">你好</div></section>
</main>
<section class="learn" id="learn"><div class="card"><div class="label">📚 Từ điển HSK tích hợp</div><input class="search" id="search" placeholder="Tìm 汉字, Pinyin hoặc nghĩa tiếng Việt..."><div id="wordList"></div></div></section>
<div class="footer">Liên Hoa Global Education • LIÊN HOA PINYIN • HỌC ĐỂ THAY ĐỔI</div>
</div>
<script>
const D=[
['我','wo3','tôi, mình',1],['你','ni3','bạn, anh, chị',1],['他','ta1','anh ấy, ông ấy',1],['她','ta1','cô ấy, bà ấy',1],['我们','women3','chúng tôi, chúng ta',1],['你们','nimen3','các bạn',1],['他们','tamen2','họ',1],['人','ren2','người',1],['好','hao3','tốt; khỏe',1],['你好','nihao3','xin chào',1],['谢谢','xiexie4','cảm ơn',1],['不客气','bukeqi4','không có gì',1],['再见','zaijian4','tạm biệt',1],['请','qing3','mời; xin',1],['对不起','duibuqi3','xin lỗi',1],['没关系','meiguanxi4','không sao',1],['是','shi4','là',1],['不是','bushi4','không phải',1],['有','you3','có',1],['没有','meiyou3','không có',1],['在','zai4','ở; tại',1],['也','ye3','cũng',1],['都','dou1','đều',1],['很','hen3','rất',1],['太','tai4','quá',1],['也许','yeshu3','có lẽ',2],['什么','shenme5','cái gì',1],['谁','shei2','ai',1],['哪','na3','nào',1],['哪里','nali3','ở đâu',1],['怎么','zenme5','thế nào',1],['多少','duoshao3','bao nhiêu',1],['几','ji3','mấy',1],['吗','ma5','trợ từ nghi vấn',1],['呢','ne5','trợ từ',1],['这','zhe4','này, đây',1],['那','na4','kia, đó',1],['这里','zheli3','ở đây',1],['那里','nali3','ở đó',1],['今天','jintian1','hôm nay',1],['明天','mingtian1','ngày mai',1],['昨天','zuotian1','hôm qua',1],['现在','xianzai4','bây giờ',1],['时候','shihou4','thời gian, lúc',1],['年','nian2','năm',1],['月','yue4','tháng',1],['日','ri4','ngày',1],['星期','xingqi1','tuần, thứ',1],['一','yi1','một',1],['二','er4','hai',1],['三','san1','ba',1],['四','si4','bốn',1],['五','wu3','năm',1],['六','liu4','sáu',1],['七','qi1','bảy',1],['八','ba1','tám',1],['九','jiu3','chín',1],['十','shi2','mười',1],['百','bai3','trăm',1],['钱','qian2','tiền',1],['多少','duoshao3','bao nhiêu',1],['家','jia1','nhà, gia đình',1],['学校','xuexiao4','trường học',1],['学生','xuesheng1','học sinh, sinh viên',1],['老师','laoshi1','giáo viên',1],['同学','tongxue2','bạn học',1],['朋友','pengyou3','bạn bè',1],['医生','yisheng1','bác sĩ',1],['医院','yiyuan4','bệnh viện',1],['中国','zhongguo2','Trung Quốc',1],['中文','zhongwen2','tiếng Trung',1],['汉语','hanyu3','tiếng Hán',1],['学习','xuexi2','học tập',1],['学','xue2','học',1],['说','shuo1','nói',1],['听','ting1','nghe',1],['看','kan4','xem; nhìn',1],['读','du2','đọc',1],['写','xie3','viết',1],['吃','chi1','ăn',1],['喝','he1','uống',1],['买','mai3','mua',1],['去','qu4','đi',1],['来','lai2','đến',1],['回','hui2','về',1],['住','zhu4','sống; ở',1],['工作','gongzuo4','làm việc; công việc',1],['上班','shangban1','đi làm',1],['喜欢','xihuan1','thích',1],['爱','ai4','yêu',1],['想','xiang3','muốn; nghĩ',1],['知道','zhidao4','biết',1],['认识','renshi5','quen; biết',1],['觉得','jue2de5','cảm thấy',2],['可以','keyi3','có thể; được',1],['会','hui4','biết, có thể',1],['要','yao4','muốn; cần',1],['能','neng2','có thể',1],['给','gei3','cho',1],['做','zuo4','làm',1],['开','kai1','mở; lái',1],['坐','zuo4','ngồi; đi bằng',1],['买东西','maidongxi3','mua đồ',1],['东西','dongxi5','đồ vật; thứ',1],['水','shui3','nước',1],['茶','cha2','trà',1],['饭','fan4','cơm; bữa ăn',1],['米饭','mifan4','cơm',1],['水果','shuiguo3','trái cây',1],['苹果','pingguo3','quả táo',1],['猫','mao1','mèo',1],['狗','gou3','chó',1],['天气','tianqi4','thời tiết',1],['下雨','xiayu3','mưa',1],['热','re4','nóng',1],['冷','leng3','lạnh',1],['大','da4','to, lớn',1],['小','xiao3','nhỏ',1],['多','duo1','nhiều',1],['少','shao3','ít',1],['新','xin1','mới',1],['老','lao3','cũ; già',1],['高兴','gaoxing1','vui',1],['漂亮','piaoliang5','đẹp',1],['快','kuai4','nhanh',1],['慢','man4','chậm',1],['高','gao1','cao',1],['低','di1','thấp',1],['长','chang2','dài',1],['短','duan3','ngắn',1],['第一','diyi1','thứ nhất',1],['因为','yinwei4','bởi vì',2],['所以','suoyi3','cho nên',2],['但是','danshi4','nhưng',2],['如果','ruguo3','nếu',2],['然后','ranhou4','sau đó',2],['一起','yiqi3','cùng nhau',2],['已经','yijing1','đã',2],['正在','zhengzai4','đang',2],['开始','kaishi3','bắt đầu',2],['结束','jieshu4','kết thúc',2],['帮助','bangzhu4','giúp đỡ',2],['问题','wenti2','vấn đề; câu hỏi',2],['办法','banfa3','cách, biện pháp',2],['希望','xiwang4','hy vọng',2],['重要','zhongyao4','quan trọng',2],['语言','yuyan3','ngôn ngữ',2],['汉字','hanzi4','chữ Hán',2],['考试','kaoshi4','thi; kỳ thi',2],['准备','zhunbei4','chuẩn bị',2],['学习','xuexi2','học tập',1],['中国人','zhongguoren2','người Trung Quốc',1],['越南','yuenan2','Việt Nam',2],['越南人','yuenanren2','người Việt Nam',2]
];
const input=document.getElementById('input'),candidates=document.getElementById('candidates'),preview=document.getElementById('preview');
const norm=s=>s.toLowerCase().trim().replace(/ü/g,'v').replace(/[1-5]/g,'').replace(/[^a-zv']/g,'');
const toneMap={a:['a','ā','á','ǎ','à'],e:['e','ē','é','ě','è'],i:['i','ī','í','ǐ','ì'],o:['o','ō','ó','ǒ','ò'],u:['u','ū','ú','ǔ','ù'],ü:['ü','ǖ','ǘ','ǚ','ǜ']};
function toneWord(s,t){s=s.replace(/v/g,'ü');let a=[...s],idx=-1;for(let i=a.length-1;i>=0;i--)if('aeo'.includes(a[i])){idx=i;break}if(idx<0)for(let i=a.length-1;i>=0;i--)if('iuü'.includes(a[i])){idx=i;break}return idx<0?s:a.slice(0,idx).join('')+toneMap[a[idx]][t]+a.slice(idx+1).join('')}
function toneText(s){return s.replace(/([a-züv]+)([1-4])/gi,(m,p,t)=>toneWord(p.toLowerCase(),+t))}
function lookup(q){let n=norm(q);if(!n)return[];return D.filter(x=>norm(x[1])===n).slice(0,10)}
function phraseCandidates(raw){let q=norm(raw), exact=lookup(raw);if(exact.length)return exact;return D.filter(x=>norm(x[1]).startsWith(q)||q.startsWith(norm(x[1]))).sort((a,b)=>Math.abs(norm(a[1]).length-q.length)-Math.abs(norm(b[1]).length-q.length)).slice(0,8)}
function renderCandidates(){let raw=input.value.trim().split(/\s+/).pop()||'';let arr=phraseCandidates(raw);candidates.innerHTML='';if(!raw){candidates.innerHTML='<span class="empty">Gõ Pinyin để hiện ứng viên chữ Hán.</span>';return}arr.forEach((x,i)=>{let b=document.createElement('button');b.className='candidate'+(i===0?' primary':'');b.innerHTML='<b>'+(i+1)+'</b>'+x[0];b.title=x[1]+' • '+x[2];b.onclick=()=>insertCandidate(x);candidates.appendChild(b)});if(!arr.length)candidates.innerHTML='<span class="empty">Chưa có từ này trong từ điển tích hợp. Bạn vẫn có thể dùng Pinyin có dấu.</span>'}
function insertCandidate(x){let parts=input.value.split(/(\s+)/),i=parts.length-1;while(i>=0&&/^\s+$/.test(parts[i]))i--;if(i>=0)parts[i]=x[0];input.value=parts.join('')+' ';render();input.focus()}
function render(){renderCandidates();let raw=input.value;let out=raw;let chunks=raw.split(/(\s+)/);for(let i=0;i<chunks.length;i++){if(!/^\s+$/.test(chunks[i])){let hit=lookup(chunks[i]);if(hit.length)chunks[i]=hit[0][0];}}out=chunks.join('');preview.textContent=out||'你好'}
function insert(k){if(k==='⌫')input.value=input.value.slice(0,-1);else if(k==='ENTER')input.value+='\n';else input.value+=k;input.focus();render()}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>insert(b.dataset.k));
document.getElementById('useTone').onclick=()=>{input.value=toneText(input.value);render()};
document.getElementById('clear').onclick=()=>{input.value='';render();input.focus()};
document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(preview.textContent);alert('Đã sao chép chữ Hán!')};
const wordList=document.getElementById('wordList'),search=document.getElementById('search');
function showWords(q=''){let n=q.toLowerCase().trim();let arr=D.filter(x=>!n||x[0].includes(q)||x[1].toLowerCase().includes(n)||x[2].toLowerCase().includes(n));wordList.innerHTML=arr.map(x=>`<div class="wordCard"><div class="han">${x[0]}</div><div class="py">${toneText(x[1])}</div><div class="meaning">${x[2]}</div><div class="meta">HSK ${x[3]}</div></div>`).join('')||'<div class="empty">Không tìm thấy.</div>'}
search.addEventListener('input',()=>showWords(search.value));
document.getElementById('tabType').onclick=()=>{document.getElementById('tool').classList.remove('hide');document.getElementById('learn').classList.remove('show');document.getElementById('tabType').classList.add('active');document.getElementById('tabLearn').classList.remove('active')};
document.getElementById('tabLearn').onclick=()=>{document.getElementById('tool').classList.add('hide');document.getElementById('learn').classList.add('show');document.getElementById('tabLearn').classList.add('active');document.getElementById('tabType').classList.remove('active');showWords(search.value)};
input.addEventListener('input',render);render();
</script>
</body></html>
